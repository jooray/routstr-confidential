[package]
name = "twopc"
version = "0.1.0"
edition = "2024"
description = "Two-party TLS 1.3 key schedule (protocol v2): joint P-256 key share, ECtF, node-only authenticated garbling (three-halves tables, IT-MAC consistency check)"
license = "MIT"

[lib]
name = "twopc"

[[bin]]
name = "cu-2pc"
path = "src/bin/cu-2pc.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[dependencies]
mpz-circuits = { git = "https://github.com/tlsnotary/mpz2", rev = "8f897838f4e24aff9da8e8b012e8ba35ae770141", features = ["sha2"] }
mpz-common = { git = "https://github.com/tlsnotary/mpz2", rev = "8f897838f4e24aff9da8e8b012e8ba35ae770141" }
mpz-core = { git = "https://github.com/tlsnotary/mpz2", rev = "8f897838f4e24aff9da8e8b012e8ba35ae770141" }
mpz-ot = { git = "https://github.com/tlsnotary/mpz2", rev = "8f897838f4e24aff9da8e8b012e8ba35ae770141" }
mpz-ot-core = { git = "https://github.com/tlsnotary/mpz2", rev = "8f897838f4e24aff9da8e8b012e8ba35ae770141" }
mpz-ole = { git = "https://github.com/tlsnotary/mpz2", rev = "8f897838f4e24aff9da8e8b012e8ba35ae770141" }
mpz-share-conversion = { git = "https://github.com/tlsnotary/mpz2", rev = "8f897838f4e24aff9da8e8b012e8ba35ae770141" }
mpz-fields = { git = "https://github.com/tlsnotary/mpz2", rev = "8f897838f4e24aff9da8e8b012e8ba35ae770141" }

p256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }
sha2 = { version = "0.10", features = ["compress"] }
rand = "0.10"
getrandom = "0.3"
futures = "0.3"
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
cu-crypto = { path = "../cu-crypto" }
# WAN emulation for the benchmark (`zkbench::transport::emulated_link`).
zkbench = { path = "../zkbench" }

