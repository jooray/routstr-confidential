[package]
name = "cu-sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cu-sidecar"
path = "src/main.rs"

[dependencies]
cu-crypto = { path = "../cu-crypto" }
zkbench = { path = "../zkbench" }
twopc = { path = "../twopc" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

rustls-webpki = { version = "0.103", features = ["aws-lc-rs", "alloc", "std"] }
rustls-pki-types = "1"
webpki-roots = "1"
ed25519-dalek = "2"
