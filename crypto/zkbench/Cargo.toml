[package]
name = "zkbench"
version = "0.1.0"
edition = "2024"

[dependencies]
cu-crypto = { path = "../cu-crypto" }
mpz-circuits = { git = "https://github.com/tlsnotary/mpz2", rev = "eaca5f9d9f30167c9525716e8f0aa9e33d886e5e", features = ["aes"] }
mpz-common = { git = "https://github.com/tlsnotary/mpz2", rev = "eaca5f9d9f30167c9525716e8f0aa9e33d886e5e" }
mpz-core = { git = "https://github.com/tlsnotary/mpz2", rev = "eaca5f9d9f30167c9525716e8f0aa9e33d886e5e" }
mpz-memory-core = { git = "https://github.com/tlsnotary/mpz2", rev = "eaca5f9d9f30167c9525716e8f0aa9e33d886e5e" }
mpz-vm-core = { git = "https://github.com/tlsnotary/mpz2", rev = "eaca5f9d9f30167c9525716e8f0aa9e33d886e5e" }
mpz-ot = { git = "https://github.com/tlsnotary/mpz2", rev = "eaca5f9d9f30167c9525716e8f0aa9e33d886e5e", features = ["ideal"] }
mpz-zk = { git = "https://github.com/tlsnotary/mpz2", rev = "eaca5f9d9f30167c9525716e8f0aa9e33d886e5e" }
mpz-hash = { git = "https://github.com/tlsnotary/mpz2", rev = "eaca5f9d9f30167c9525716e8f0aa9e33d886e5e", default-features = false, features = ["sha256"] }
futures = "0.3"
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
rand = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes = "0.8"
hex = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
itybity = "0.2"
async-trait = "0.1"
serio = "0.2"
zeroize = { version = "1", features = ["derive"] }

[features]
rayon = ["mpz-zk/rayon"]

[profile.release]
debug = false
