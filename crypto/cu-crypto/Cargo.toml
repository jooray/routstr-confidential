[package]
name = "cu-crypto"
version = "0.1.0"
edition = "2021"
description = "Native TLS 1.3 key schedule, AES-GCM record math and transcript hashing for the confidential-upstream protocol"
license = "MIT"

[dependencies]
aes = "0.8"
sha2 = "0.10"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hex = "0.4"
